# S-14 CI 必過關卡。job 名稱即 main 分支保護要求的 status check 名稱，改名時須同步更新分支保護。
# 各關卡由建立其測試的 Task 啟用：RLS 權限測試於 T03，AI 輸出 schema 驗證於 T14，SSRF 於 T16，prompt injection 於 T18。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  quality:
    name: test、typecheck、lint、build、依賴方向
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安裝依賴
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm exec eslint .
      - name: 依賴方向檢查
        run: pnpm depcruise
      - name: build
        run: pnpm build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 安裝 gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      # fetch-depth: 0 會取得所有分支；只掃描本次 HEAD 可達的 commit，避免其他分支的內容影響此 PR
      - name: 掃描此分支全部 commit
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="HEAD" .

  audit:
    name: 依賴漏洞（high 以上）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm audit
        run: pnpm audit --audit-level high
